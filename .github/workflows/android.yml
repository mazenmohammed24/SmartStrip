name: Android CI

on:
  push:
    branches: [master, main]
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build and test debug APK
        run: cd android && ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Version alpha APK
        id: alpha_apk
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          ALPHA_VERSION="${VERSION_NAME}-alpha"
          DEST="android/app/build/outputs/apk/debug/SmartStrip-${ALPHA_VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=SmartStrip-${ALPHA_VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.alpha_apk.outputs.name }}
          path: ${{ steps.alpha_apk.outputs.path }}
          retention-days: 30
